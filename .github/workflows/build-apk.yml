name: Minecraft Music Mod APK Oluşturucu

# Bu işlem depoya (main dalına) bir şey yüklendiğinde VEYA "Actions" sekmesinden manuel tetiklendiğinde çalışır.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Android APK Derleme İşlemi
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Depoyu Klonla (Checkout)
      uses: actions/checkout@v4

    - name:  Node.js Kurulumu (Capacitor İçin)
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: ☕ Java 17 Kurulumu (Android Gradle İçin)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: 🚀 Capacitor Projesini Oluştur ve Ayarla
      run: |
        mkdir app_build
        cd app_build
        
        # Projeyi başlat
        npm init -y
        npm install @capacitor/core @capacitor/android
        npm install -D @capacitor/cli @capacitor/assets
        
        # Capacitor Ayarları (İsim ve Paket ID)
        npx cap init "Minecraft Music Mod" com.safadam.minecraftmusicmod --web-dir www
        
        # HTML Dosyasını sisteme entegre et (index.html olarak dönüştürür)
        mkdir www
        cp "../Minecraft Music Mod Studio.html" www/index.html
        
        # Gönderilen resmi hem ikon hem de splash (açılış ekranı) için ayarla
        mkdir assets
        cp "../1787261854224.png" assets/icon.png
        cp "../1787261854224.png" assets/splash.png
        
        # Android ortamını inşa et
        npx cap add android
        
        # Otomatik olarak logoları tüm Android boyutlarına göre (HDPI, XXHDPI vs.) kes ve oluştur
        npx capacitor-assets generate --android
        
        # GEREKLİ İZİNLER: AndroidManifest.xml'e otomatik olarak dosya okuma/yazma izinlerini enjekte et
        MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
        sed -i '/<uses-permission android:name="android.permission.INTERNET" \/>/a \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" \/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" \/>' $MANIFEST_PATH

    - name: 🏗️ APK'yı Derle (Gradle Build)
      run: |
        cd app_build/android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: 📦 APK Dosyasını Çıktı Olarak Yükle
      uses: actions/upload-artifact@v4
      with:
        name: Minecraft-Music-Mod-APK
        path: app_build/android/app/build/outputs/apk/debug/app-debug.apk
