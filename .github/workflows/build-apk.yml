name: Minecraft Music Mod APK Oluşturucu

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Android APK Derleme İşlemi
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Depoyu Klonla (Checkout)
      uses: actions/checkout@v4

    - name: ⚙️ Node.js Kurulumu (Capacitor İçin)
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: ☕ Java 17 Kurulumu (Android Gradle LTS)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: 🚀 Capacitor Projesini Oluştur ve Ayarla
      run: |
        mkdir app_build
        cd app_build
        
        # Projeyi başlat ve bağımlılıkları kur
        npm init -y
        npm install @capacitor/core @capacitor/android
        npm install -D @capacitor/cli @capacitor/assets
        
        # Capacitor Ayarları
        npx cap init "Minecraft Music Mod" com.safadam.minecraftmusicmod --web-dir www
        
        # Web dosyalarını ve varlıkları kopyala
        mkdir -p www assets
        cp "../Minecraft Music Mod Studio.html" www/index.html
        cp "../1787261854224.png" assets/icon.png
        cp "../1787261854224.png" assets/splash.png
        
        # Android platformunu ekle ve varlıkları üret
        npx cap add android
        npx capacitor-assets generate --android
        npx cap sync android
        
        # KOTLIN ÇAKIŞMA DÜZELTMESİ (Görseldeki duplicate class hatasını çözer)
        cat << 'EOF' >> android/app/build.gradle

        dependencies {
            constraints {
                implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22") {
                    because("kotlin-stdlib-jdk7 is now a part of kotlin-stdlib")
                }
                implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22") {
                    because("kotlin-stdlib-jdk8 is now a part of kotlin-stdlib")
                }
            }
        }
        EOF

        # Gerekli depolama izinlerini ekle
        MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
        sed -i '/<application/i \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />' $MANIFEST_PATH

    - name: 🏗️ APK'yı Derle (Gradle Build)
      run: |
        cd app_build/android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: 📦 APK Dosyasını Çıktı Olarak Yükle
      uses: actions/upload-artifact@v4
      with:
        name: Minecraft-Music-Mod-APK
        path: app_build/android/app/build/outputs/apk/debug/app-debug.apk
